  - id: F-003
    title: 検品端末の入れ替え手順を倉庫ごとに揃える
    status: confirmed
    source: "transcripts/2026-01-15_handoff.txt:3"
    fresh: 2026-01-15
    note: >-
      倉庫の閉館後に予備端末を搬入し、開館までに充電と時刻合わせを済ませる。
      端末の番号は底面で照合し、古い番号が残っていたら管理表を検索する。
      搬入用の箱と廃棄用の箱は色で見分け、翌朝に担当者が返却数を数える。
      作業写真は共用の帳票に時系列で貼り、倉庫ごとに全景とラベルの写真を残す。
      端末が起動しなければ予備機に交換し、後日、不良品を別送する。
      初日の立ち会いは受付が担当し、問い合わせがあれば当日の作業者へ回す。
      （人員の異動時は、検品責任者の引き継ぎを当日の端末点検に合わせる。）
      写真を確認したら箱をたたみ、清掃用品と充電器を棚に戻す。

