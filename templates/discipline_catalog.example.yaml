# ═══════════════════════════════════════════════════════════════════════════
# discipline_catalog.example.yaml — the input to scripts/discipline_scan.py.
#
# WHAT THIS IS: the FORMAT of the list of disciplines you want audited, each
# with the regex that would catch it in your own session logs. Copy it somewhere
# your own instance data lives (e.g. judgment/discipline_catalog.yaml — outside
# the tracked kit) and write in the disciplines you actually adopted.
#
#   scripts/discipline_scan.py --catalog judgment/discipline_catalog.yaml --since 7d
#
# WHAT IT IS NOT: a scoring rubric. The scanner quotes matching passages and
# stops there. See docs/discipline-audit.md.
#
# ── the two types, because they decide what a number means ─────────────────
#   type: trace        a discipline that COMMANDS AN ACTION. Obeying it leaves
#                      a trace, so `fire:` can find it, firings are countable,
#                      and zero firings is a real dead-letter signal.
#   type: prohibition  a discipline that COMMANDS RESTRAINT. Obeying it is the
#                      sentence you did NOT write — no log contains it, so
#                      FIRINGS ARE UNOBSERVABLE and `fire:` is rejected by the
#                      parser. Only `breach:` works, and zero breaches proves
#                      nothing. Never call a prohibition a dead letter.
#   The practical consequence: if you want a discipline to be auditable, WRITE
#   IT AS A TRACE. "Don't assert what you haven't checked" is unmeasurable;
#   "hit the primary source once before you assert" leaves a mark.
#
# ── fields ─────────────────────────────────────────────────────────────────
#   id           short stable handle (appears in the report)
#   type         trace | prohibition
#   name         the discipline as one readable sentence
#   origin       where it came from (file, section, journal id) — optional
#   role         whose turns `fire:` is searched in: assistant | user | any
#                (default: assistant)
#   breach_role  same, for `breach:` (default: whatever `role` is). Breaches
#                are often visible only as the APPROVER correcting you, which
#                is why this can differ.
#   fire         regex for the discipline being obeyed  (trace only)
#   breach       regex for it being broken              (optional)
#   note         one line carried into the report — optional
#
# ── format ─────────────────────────────────────────────────────────────────
# A tiny YAML subset (parsed by the script itself, so nothing to install):
# one `disciplines:` list, `- key: value` items, scalars only.
# QUOTE YOUR REGEXES WITH SINGLE QUOTES — inside them everything is literal
# (backslashes included) and '' means one quote. Bare values run to the end of
# the line, so they cannot carry a trailing # comment.
#
# ── writing the patterns ───────────────────────────────────────────────────
# Aim for the discipline's VOCABULARY, not its meaning: the words that only
# appear when it is being obeyed. Over-broad is survivable (you drop the
# candidate when you read the fragment); over-narrow is not (you get a false
# dead letter and delete a discipline that was working). Include the languages
# you actually work in. Every catalog is local by construction — these
# patterns are examples, not a standard.
#
# THIS FILE SHIPS WITH ZERO ENTRIES. A catalog is a list of the disciplines YOU
# adopted; a shipped list would audit somebody else's, report dead letters for
# rules you never took, and quietly suggest you adopt them. One entry is written
# out below AS A COMMENT so the field shapes are concrete — it is illustration,
# not a starting set, and it is not parsed.
# ═══════════════════════════════════════════════════════════════════════════

disciplines: []

# ── one entry, spelled out, AS A COMMENT (not parsed — copy it and edit) ───
#
#  - id: X1
#    type: trace
#    name: <the discipline as one readable sentence>
#    origin: <where it came from — a file + section, or a journal entry id>
#    role: assistant
#    fire: '<regex for the discipline being OBEYED — its vocabulary, not its meaning>'
#    breach: '<optional: regex for it being BROKEN>'
#    breach_role: user
#    note: <one line carried into the report>
#
# A prohibition entry is the same minus `fire:` (which the parser rejects for
# type: prohibition, because compliance with a prohibition leaves no trace):
#
#  - id: X1-P
#    type: prohibition
#    name: <the restraint half of the same discipline>
#    origin: <...>
#    role: assistant
#    breach: '<regex for the forbidden thing appearing anyway>'
#    note: firings unobservable — the audit reads the paired trace entry, not this one.
