name: community-automerge

# ═══════════════════════════════════════════════════════════════════════════
# The cookbook/community/ lane: a pull request that touches ONLY
# cookbook/community/<author>/ and passes a mechanical format lint is approved
# and squash-merged with no maintainer in the loop. Everything else is left
# alone and labelled for the maintainer's adjudication lane — this workflow
# never rejects, never closes, and never merges anything outside one directory.
#
# The whole gate rests on ONE invariant: every changed path must start with
# `cookbook/community/<the PR author's own login>/`. That prefix is built from
# COMMUNITY_ROOT (a constant below) plus pull_request.user.login (which the
# author cannot forge), not from anything in the diff — so "touch someone
# else's shelf" and "touch the kit" are the same case, and both leave the lane.
#
# The root `community/` path is NO LONGER the auto-merge lane: a PR into it is
# outside the prefix and therefore goes to the maintainer's lane, unmerged.
#
# pull_request_target is used deliberately: fork PRs need a write token to be
# approved and merged. The PR's code is NEVER checked out and NEVER executed —
# the only checkout is the BASE branch (for tests/forbidden_patterns.txt), and
# the PR's files are read as data through the blob API and the tree API.
#
# Beyond the path prefix, the gate refuses anything it cannot read as plain
# text it can be sure of: symlinks and submodules (read from the head TREE's
# file mode — metadata, never a checkout), non-UTF-8 bytes (byte round trip,
# not a hunt for replacement characters), C0 control characters, and credential
# shapes. Every text rule is applied a second time to the NFKC normalisation,
# so a compatibility spelling is not a way past a regex. All of it FAILS
# CLOSED: anything unreadable goes to the maintainer, never to merge.
#
# The whole lane is armed by a repository variable, COMMUNITY_AUTOMERGE_ENABLED.
# Unset or anything but "true" ⇒ nothing is auto-merged and every PR goes to
# the maintainer. It is default-off on purpose: a lane that merges with no
# human in it must be switched on by a human, and a fork must not inherit one
# already armed.
# ═══════════════════════════════════════════════════════════════════════════

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Minimal. NOTE: creating a repository label is an `issues` scope operation, so
# the first-use auto-create below will 403 under these permissions — pre-create
# the `管理者裁定レーン` label in repo settings (or grant `issues: write`). The
# call is wrapped: if labelling fails the workflow comments instead, so the
# "a maintainer decides this one" signal is never lost.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: community-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # base branch only — this is our own code, not the contributor's
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/github-script@v7
        env:
          # the kill switch. A repository VARIABLE (not a secret), so a
          # maintainer can flip the lane off from the settings UI without
          # touching this file. Unset reads as empty ⇒ the lane is off.
          COMMUNITY_AUTOMERGE_ENABLED: ${{ vars.COMMUNITY_AUTOMERGE_ENABLED }}
        with:
          script: |
            const fs = require('fs');

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const login = pr.user.login;

            // ── the ONE place the lane's location is written ────────────────
            // Every path check, every message, and every doc link below is
            // derived from this constant. Changing the lane's home is this line
            // plus the docs it names — never a second literal somewhere else.
            const COMMUNITY_ROOT = 'cookbook/community';
            const COMMUNITY_README = `${COMMUNITY_ROOT}/README.md`;

            const MAX_FILES = 3;
            const MAX_BYTES = 50 * 1024;
            const ADMIN_LABEL = '管理者裁定レーン';
            const URL_HOSTS = ['github.com', 'zenn.dev'];

            // ── the admin lane: label, and do nothing else ──────────────────
            async function adminLane(reason) {
              core.notice(`admin adjudication lane: ${reason}`);
              try {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: ADMIN_LABEL });
                } catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({
                    owner, repo, name: ADMIN_LABEL, color: 'ededed',
                    description: `Outside the ${COMMUNITY_ROOT}/ auto-merge lane — a maintainer decides.`,
                  });
                }
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [ADMIN_LABEL],
                });
              } catch (e) {
                // labelling is best effort; the signal must not be lost
                core.warning(`could not label (${e.status || e.message}) — commenting instead`);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `This PR is outside the \`${COMMUNITY_ROOT}/\` auto-merge lane, so a maintainer will review it. / `
                      + `この PR は \`${COMMUNITY_ROOT}/\` の自動マージ対象外のため、管理者が裁定します。`,
                });
              }
            }

            // ── a lint failure: tell the author WHICH rule and WHERE ────────
            // Never echo the matched text or the pattern: this comment is public
            // and permanent, and the matched text is exactly what must not spread.
            async function lintFailed(problems) {
              const list = problems.map((p) => `- \`${p.file}\`${p.line ? ` (line ${p.line})` : ''} — **${p.rule}**`).join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  `Automatic merge declined by the \`${COMMUNITY_ROOT}/\` format lint. Fix and push again — the check re-runs.`,
                  '',
                  list,
                  '',
                  'The matched text is deliberately not quoted here (this comment is public and permanent). '
                    + `See [\`${COMMUNITY_README}\`](../blob/HEAD/${COMMUNITY_README}) for the rule list.`,
                  '',
                  '---',
                  '',
                  `\`${COMMUNITY_ROOT}/\` の形式 lint に引っかかったため自動マージしませんでした。修正して push し直すと再判定されます。`,
                  '該当箇所の**中身はここに引用しません**（このコメントは公開・恒久のため）。ルール一覧は '
                    + `[\`${COMMUNITY_README}\`](../blob/HEAD/${COMMUNITY_README})。`,
                ].join('\n'),
              });
              core.setFailed(`community lint: ${problems.length} problem(s)`);
            }

            // ── 0. only the default branch is auto-mergeable ────────────────
            if (pr.base.ref !== context.payload.repository.default_branch) {
              core.notice(`base is ${pr.base.ref}, not the default branch — nothing to do`);
              return;
            }

            // ── 0b. the kill switch ─────────────────────────────────────────
            // Checked BEFORE anything is read or judged: during an incident the
            // wanted behaviour is "the bot stops acting", not "the bot keeps
            // posting lint verdicts it will not act on". Default-off is
            // deliberate — a lane that merges without a human must be switched
            // on by a human, and a fork of this repository must not inherit an
            // armed one.
            if (process.env.COMMUNITY_AUTOMERGE_ENABLED !== 'true') {
              await adminLane('auto-merge is switched off (repository variable '
                + 'COMMUNITY_AUTOMERGE_ENABLED is not "true")');
              return;
            }

            // ── 1. the changed paths ────────────────────────────────────────
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            if (files.length === 0) {
              await adminLane('no files changed');
              return;
            }
            if (files.length > MAX_FILES) {
              await adminLane(`${files.length} files changed (max ${MAX_FILES})`);
              return;
            }

            // THE load-bearing check: the prefix comes from the PR author's own
            // login, never from the diff. GitHub logins are unique
            // case-insensitively, so the directory is compared case-folded.
            const prefix = `${COMMUNITY_ROOT}/${login.toLowerCase()}/`;
            // built FROM the constant, so the root can never drift between the
            // prefix check and the shape check (COMMUNITY_ROOT has no regex
            // metacharacters — keep it that way).
            const SAFE_PATH = new RegExp(
              '^' + COMMUNITY_ROOT + '/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]+\\.md$');

            const outside = [];
            for (const f of files) {
              const paths = [f.filename];
              if (f.previous_filename) paths.push(f.previous_filename);
              for (const p of paths) {
                if (p.includes('..') || p.includes('\\') || p.startsWith('/')) {
                  outside.push(`${p} (unsafe path)`);
                } else if (!SAFE_PATH.test(p)) {
                  outside.push(`${p} (not ${COMMUNITY_ROOT}/<login>/<name>.md)`);
                } else if (!p.toLowerCase().startsWith(prefix)) {
                  outside.push(`${p} (not this author's shelf)`);
                }
              }
            }
            if (outside.length > 0) {
              await adminLane(`outside the lane: ${outside.join(', ')}`);
              return;
            }

            // ── 1b. what KIND of object each path is ────────────────────────
            // listFiles does not carry the file mode, and the mode is where two
            // whole classes of trouble live: a symlink (mode 120000) whose
            // "content" is a path into the checkout, and a submodule (160000 /
            // type "commit") that points at another repository entirely. Both
            // are read from the PR head's TREE — metadata, never a checkout,
            // never execution. Everything here FAILS CLOSED: if the mode cannot
            // be read for any reason, the PR goes to the maintainer.
            const ALLOWED_MODES = ['100644', '100755'];

            async function headTreeRoot() {
              const tries = [{ owner, repo }];   // fork heads live in our object store too
              if (pr.head.repo) {
                tries.push({ owner: pr.head.repo.owner.login, repo: pr.head.repo.name });
              }
              for (const t of tries) {
                try {
                  const c = await github.rest.git.getCommit({ ...t, commit_sha: pr.head.sha });
                  return { ...t, tree: c.data.tree.sha };
                } catch (e) { /* try the next place */ }
              }
              return null;
            }

            // walk the tree segment by segment. Never a recursive listing: past
            // a size limit GitHub truncates one, and a truncated tree drops the
            // entry we needed without saying which one it dropped.
            async function entryOf(root, path) {
              const segs = path.split('/');
              let sha = root.tree;
              for (let i = 0; i < segs.length; i++) {
                let t;
                try {
                  t = await github.rest.git.getTree({ owner: root.owner, repo: root.repo, tree_sha: sha });
                } catch (e) { return null; }
                if (t.data.truncated) return null;
                const e = t.data.tree.find((x) => x.path === segs[i]);
                if (!e) return null;
                if (i === segs.length - 1) return e;
                if (e.type !== 'tree') return null;
                sha = e.sha;
              }
              return null;
            }

            const root = await headTreeRoot();
            if (root === null) {
              await adminLane('could not read the head tree — file modes unverifiable');
              return;
            }
            for (const f of files) {
              if (f.status === 'removed') continue;
              const e = await entryOf(root, f.filename);
              if (e === null) {
                await adminLane(`${f.filename}: not found in the head tree (mode unverifiable)`);
                return;
              }
              if (e.mode === '120000') {
                await adminLane(`${f.filename}: symlink`);
                return;
              }
              if (e.mode === '160000' || e.type === 'commit') {
                await adminLane(`${f.filename}: submodule`);
                return;
              }
              if (e.type !== 'blob' || !ALLOWED_MODES.includes(e.mode)) {
                await adminLane(`${f.filename}: not a regular file (mode ${e.mode}, type ${e.type})`);
                return;
              }
            }

            // ── 2. the format lint ──────────────────────────────────────────
            // C0 control characters, minus the three that legitimately occur in
            // text (\t \n \r). A NUL is the classic way to make one file read
            // differently to a human and to a scanner.
            const CONTROL_RE = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/;

            const RULES = [
              { rule: 'email-address', re: /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}/ },
              // shaped, not generic: a bare digit-group regex fires on dates
              // (2026-07-28) and version strings, which this corpus is full of.
              { rule: 'phone-number', re: /(?<![\d-])0\d{1,4}[-\s]\d{1,4}[-\s]\d{3,4}(?![\d-])|(?<!\d)0[789]0\d{8}(?!\d)|\+\d{1,3}[-\s]?\d{1,4}[-\s]?\d{3,4}[-\s]?\d{3,4}(?!\d)/ },
              { rule: 'company-name (株式会社 / Inc. / LLC / Ltd)', re: /株式会社|有限会社|合同会社|（株）|\(株\)|㈱|\bInc\.|\bLLC\b|\bLtd\b/ },
              { rule: 'money-amount', re: /[¥$]\s?\d{2,}|[¥$]\s?\d+[.,]\d|[0-9０-９]\s?(?:円|万円)/ },
              { rule: 'absolute-path (/home/, /Users/, /mnt/, C:\\)', re: /\/home\/|\/Users\/|\/mnt\/[a-z]\/|\b[A-Za-z]:\\/ },
              { rule: 'parent-directory reference (..)', re: /\.\.\// },
              // credential SHAPES. Deliberately narrow: a generic "looks like a
              // long random string" rule fires on hashes and base64 the corpus
              // is full of, and a rule that cries wolf gets switched off.
              { rule: 'private-key block', re: /-----BEGIN[ A-Z]*PRIVATE KEY-----/ },
              { rule: 'API-token shape (GitHub)', re: /\bgh[pousr]_[A-Za-z0-9]{16,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b/ },
              { rule: 'API-token shape (sk-/AWS/Google/Slack)', re: /\bsk-[A-Za-z0-9_-]{16,}\b|\bAKIA[0-9A-Z]{16}\b|\bAIza[0-9A-Za-z_-]{30,}\b|\bxox[abprs]-[A-Za-z0-9-]{10,}\b/ },
            ];

            // The kit's own leak guard, applied at merge time. ci.yml does run group
            // C over a fork PR's content, but nothing here waits on its result, and a
            // merge performed by GITHUB_TOKEN does not re-trigger ci.yml on main — so
            // this is the only privacy scan that can STOP the merge. Without it, a
            // community file carrying a guarded identifier turns main red at the next
            // unrelated push, with no signal at merge time.
            const KIT_PATTERNS = fs.readFileSync('tests/forbidden_patterns.txt', 'utf8')
              .split('\n')
              .filter((l) => l.trim() !== '' && !l.trim().startsWith('#'))
              .map((l) => new RegExp(l));

            function urlProblems(lines) {
              const out = [];
              const URL_RE = /https?:\/\/[^\s<>()[\]"'`]+/g;
              lines.forEach((text, i) => {
                for (const m of text.matchAll(URL_RE)) {
                  let host = null;
                  try { host = new URL(m[0]).hostname.toLowerCase(); } catch (e) { host = null; }
                  const ok = host !== null
                    && URL_HOSTS.some((h) => host === h || host.endsWith(`.${h}`));
                  if (!ok) out.push(i + 1);
                }
              });
              return out;
            }

            const problems = [];
            for (const f of files) {
              if (f.status === 'removed') continue;
              let blob;
              try {
                blob = await github.rest.git.getBlob({ owner, repo, file_sha: f.sha });
              } catch (e) {
                problems.push({ file: f.filename, rule: `unreadable blob (${e.status || e.message})` });
                continue;
              }
              if (blob.data.size > MAX_BYTES) {
                problems.push({ file: f.filename, rule: `larger than ${MAX_BYTES} bytes` });
                continue;
              }
              // UTF-8 or nothing. The test is a byte round trip, not a hunt for
              // U+FFFD: `toString('utf8')` REPLACES invalid bytes silently, so
              // the decoded string alone can never tell you they were there.
              const raw = Buffer.from(blob.data.content, blob.data.encoding || 'base64');
              const content = raw.toString('utf8');
              if (Buffer.compare(Buffer.from(content, 'utf8'), raw) !== 0) {
                problems.push({ file: f.filename, rule: 'not valid UTF-8' });
                continue;
              }

              const lines = content.split('\n');

              // A NUL or other C0 byte makes a file read one way to a person and
              // another way to a scanner — the premise of every lint below is
              // that what a reader sees is what was scanned.
              lines.forEach((text, i) => {
                if (CONTROL_RE.test(text)) {
                  problems.push({ file: f.filename, line: i + 1, rule: 'control character (NUL / C0)' });
                }
              });

              // Every text rule runs TWICE: on the bytes as written, and on the
              // NFKC normalisation. Full-width and compatibility spellings
              // (＠, ￥, ㈱ decomposing to 株式会社) are the same string to a
              // reader and a different string to a regex.
              const norm = lines.map((t) => t.normalize('NFKC'));

              for (const r of RULES) {
                lines.forEach((text, i) => {
                  if (r.re.test(text)) {
                    problems.push({ file: f.filename, line: i + 1, rule: r.rule });
                  } else if (r.re.test(norm[i])) {
                    // named distinctly: the author cannot reproduce this match
                    // by grepping their own file, and needs to know why
                    problems.push({ file: f.filename, line: i + 1, rule: `${r.rule} (after NFKC)` });
                  }
                });
              }
              lines.forEach((text, i) => {
                if (KIT_PATTERNS.some((re) => re.test(text) || re.test(norm[i]))) {
                  problems.push({ file: f.filename, line: i + 1, rule: 'identifier on the kit leak-guard list' });
                }
              });
              const urlLines = new Set([...urlProblems(lines), ...urlProblems(norm)]);
              for (const line of urlLines) {
                problems.push({
                  file: f.filename, line,
                  rule: `link to a host outside the allowlist (${URL_HOSTS.join(', ')})`,
                });
              }
            }

            if (problems.length > 0) {
              await lintFailed(problems.slice(0, 30));
              return;
            }

            // ── 3. approve and squash-merge ─────────────────────────────────
            await github.rest.pulls.createReview({
              owner, repo, pull_number: pr.number, event: 'APPROVE',
              body: `Auto-approved: every changed path is under \`${COMMUNITY_ROOT}/${login}/\` `
                  + 'and the format lint passed. No human read this content — '
                  + `see \`${COMMUNITY_README}\` for what that means. / `
                  + `自動承認（\`${COMMUNITY_ROOT}/\` 棚・形式 lint 合格）。内容は誰もレビューしていません。`,
            });
            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'squash',
                commit_title: `community: ${login} shelf (#${pr.number})`,
              });
              core.notice(`merged #${pr.number}`);
            } catch (e) {
              core.warning(`merge failed: ${e.status || ''} ${e.message}`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: 'The lint passed and this PR is approved, but the merge did not go through '
                    + `(\`${e.status || 'error'}\`) — usually a conflict with \`main\`. Rebase and push again. / `
                    + 'lint は通り承認済みですが、マージが通りませんでした（多くは `main` との衝突）。rebase して push し直してください。',
              });
              core.setFailed('merge failed');
            }
