name: community-remove

# ═══════════════════════════════════════════════════════════════════════════
# Take-down of a community shelf, on the owner's own request.
#
# The rule is one line: the issue's AUTHOR must be the owner of the directory.
# The paths that get deleted are built as `<root>/<verified shelf name>` for
# each hard-coded root in the removal step — the roots are literals in this
# file, so no issue body can ever aim this workflow at the kit. The shelf name
# is accepted only if it is a plain GitHub login AND equals the issue author's
# login case-insensitively.
#
# MIGRATION WINDOW (one release). The live lane is `cookbook/community/`; the
# old lane was `community/` at the repository root. New shelves are only ever
# created under the new root by community-automerge.yml, but a shelf merged
# before the switch still sits under the old one — and a person asking for it
# back will write the path they were told to write. So this workflow reads
# BOTH forms in the issue body and removes the shelf from BOTH roots if it
# exists in both. Drop the legacy root from ROOTS/LEGACY_ROOT once the old
# directory is gone.
#
# HOW IT IS WOKEN UP. Two doors, because one of them does not exist in a fresh
# fork. The label `community-removal` is a repository object; a clone or a fork
# does not carry it, and an issue template's front-matter `labels:` cannot
# apply a label the repository does not have — so a label-only trigger means
# the take-down lane is silently dead in every fork (observed 2026-08-05 on
# this repository itself). The second door is a marker in the issue template's
# body, which travels with the file. Neither door decides anything: the
# ownership check in the `verify` step below is the gate, and it is the same
# for both.
#
# IDEMPOTENCE. The template carries `labels:` in its front matter, so one
# filing raises TWO events (`opened` and `labeled`). See the `rm` step for the
# two guards — a live-tip checkout and a duplicate check — and for the measured
# failure they exist to stop.
#
# What this workflow does NOT do: rewrite history. A shelf that was public is
# public in the git history of every clone and fork that already pulled it.
# See cookbook/community/README.md — deleting is not un-publishing.
# ═══════════════════════════════════════════════════════════════════════════

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: community-remove-${{ github.event.issue.number }}

jobs:
  remove:
    # Two doors, and a label that is added LATER must still be one of them.
    #  · opened  — the label is already on it (the template applied it), OR the
    #              body carries the template's marker. The marker is what makes
    #              this lane work in a fork, where the label does not exist.
    #  · labeled — only when the label just added is ours. Without that second
    #              clause every later label a maintainer adds would re-run the
    #              take-down on an issue that is already closed.
    if: >-
      (github.event.action == 'opened'
        && (contains(github.event.issue.labels.*.name, 'community-removal')
          || contains(github.event.issue.body, 'kagemusha:community-removal')))
      || (github.event.action == 'labeled'
        && github.event.label.name == 'community-removal')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const login = issue.user.login;
            const body = issue.body || '';

            // the live lane first, the pre-split lane second (migration window)
            const COMMUNITY_ROOT = 'cookbook/community';
            const LEGACY_ROOT = 'community';

            core.setOutput('ok', 'false');

            async function refuse(msgEn, msgJa, close) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `${msgEn}\n\n---\n\n${msgJa}`,
              });
              if (close) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'not_planned',
                });
              }
            }

            const LOGIN_RE = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/;
            if (!LOGIN_RE.test(login)) {
              await refuse(
                'Could not verify the requester automatically. A maintainer will handle this by hand.',
                '起票者の自動照合ができませんでした。管理者が手で対応します。',
                false);
              return;
            }

            // every shelf path claimed anywhere in the issue body, in either
            // form. The optional `cookbook/` is consumed first because matchAll
            // scans left to right, so `cookbook/community/x` yields ONE match,
            // not a nested pair.
            //
            // NOTE for whoever edits the issue template: this reads the body
            // RAW, so an HTML comment is not a hiding place — a sample path
            // inside `<!-- -->` is claimed exactly like a visible one. Any
            // complete `community/<some login>/` in the template is therefore
            // read as a request to remove THAT person's shelf, and refuses the
            // filer's own correct request. The `<your-login>` placeholder is
            // safe for a mechanical reason: the character class below stops at
            // `<`, so the match is the bare root and `shelfSegment` returns ''.
            const CLAIM_RE = /(?:cookbook\/)?community\/[A-Za-z0-9._/-]*/g;
            const claimed = [...body.matchAll(CLAIM_RE)].map((m) => m[0]);
            if (claimed.length === 0) {
              await refuse(
                `Please state the path to remove, in the form \`${COMMUNITY_ROOT}/<your GitHub login>/\`.`,
                `削除対象を \`${COMMUNITY_ROOT}/<あなたの GitHub ログイン名>/\` の形で本文に書いてください。`,
                false);
              return;
            }

            const MINE = 'Only the owner of a shelf can ask for it to be removed. '
              + 'The requested path does not belong to this account.';
            const MINE_JA = `ご本人からの依頼のみ受け付けます（対象パスの \`${COMMUNITY_ROOT}/<ログイン名>/\` が起票者と一致しません）。`;

            // strip whichever root the writer used, THEN take the first segment.
            // Doing it the other way round (split('/')[1]) reads `community` as
            // the shelf name for the new form — a correct request refused.
            function shelfSegment(p) {
              for (const root of [COMMUNITY_ROOT, LEGACY_ROOT]) {
                if (p === root || p === `${root}/`) return '';
                if (p.startsWith(`${root}/`)) return p.slice(root.length + 1).split('/')[0];
              }
              return '';
            }

            const shelves = new Set();
            for (const p of claimed) {
              if (p.includes('..')) {
                await refuse(MINE, MINE_JA, true);
                return;
              }
              const seg = shelfSegment(p);
              // not a login-shaped segment → the template's own `<your-login>/`
              // placeholder, or a mention of the shelf README. Ignore, don't refuse.
              if (!LOGIN_RE.test(seg)) continue;
              if (seg.toLowerCase() !== login.toLowerCase()) {
                await refuse(MINE, MINE_JA, true);
                return;
              }
              shelves.add(seg);
            }
            if (shelves.size !== 1) {
              await refuse(
                `Please state exactly one shelf to remove, in the form \`${COMMUNITY_ROOT}/<your GitHub login>/\`.`,
                `削除対象を \`${COMMUNITY_ROOT}/<あなたの GitHub ログイン名>/\` の形で、1つだけ本文に書いてください。`,
                false);
              return;
            }

            const shelf = [...shelves][0];

            // Make the label exist, and put it on this issue. Best effort, and
            // deliberately AFTER the ownership check — a repository should not
            // grow labels from issues that were refused.
            //
            // Why this is possible here and not in community-automerge.yml:
            // creating a label is an `issues` scope operation, and THIS
            // workflow holds `issues: write` (it has to, to comment and close).
            // Its sibling holds only `contents` + `pull-requests`, which is why
            // the label auto-create over there is documented as 403-prone.
            //
            // This does not re-trigger the workflow: an event raised by
            // GITHUB_TOKEN does not start a new run. Even if it did, the
            // duplicate guard in the next step would make it a no-op.
            try {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'community-removal' });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: 'community-removal', color: '5319e7',
                  description: "Take-down of a community shelf, at its owner's request.",
                });
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['community-removal'],
              });
            } catch (e) {
              // the label is a convenience for the maintainer's view, never a
              // precondition of the removal — losing it must not stop anything
              core.warning(`could not ensure the community-removal label (${e.status || e.message})`);
            }

            core.setOutput('shelf', shelf);
            core.setOutput('ok', 'true');
            core.notice(`verified: ${login} may remove the shelf "${shelf}" from `
              + `${COMMUNITY_ROOT}/ and (migration window) ${LEGACY_ROOT}/`);

      - if: steps.verify.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          # NOT the default. For an `issues` event `github.sha` is the default
          # branch as it stood WHEN THE EVENT FIRED, and this workflow answers
          # two events for one filing. The second run would check out a tree in
          # which the first run's removal has not happened yet, see the shelf
          # again, and delete it a second time from a stale base. Take the live
          # tip instead; the duplicate guard below covers the rest.
          ref: ${{ github.event.repository.default_branch }}

      - id: rm
        if: steps.verify.outputs.ok == 'true'
        env:
          # via env, never inline ${{ }} in a run: block
          SHELF: ${{ steps.verify.outputs.shelf }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # second gate, in the shell: a shelf name is a plain GitHub login
          case "$SHELF" in
            "" | *[!A-Za-z0-9-]*) echo "refusing: not a plain login: $SHELF" >&2; exit 1 ;;
          esac

          # ── the duplicate guard ───────────────────────────────────────────
          # One filing raises `opened` AND `labeled`, so this step runs twice.
          # The concurrency group serialises the two runs, and serialising is
          # NOT enough: measured on this repository 2026-08-05, run 2 started
          # at 15:11:56 — three seconds AFTER run 1 finished — and still opened
          # a second deletion PR (#5 and #6, both from the branch named below),
          # because it had checked out the event's stale SHA. The checkout above
          # fixes the staleness; this fixes the rest, including the case where
          # a maintainer re-labels an issue that was already carried out.
          #
          # `--state all` is load-bearing: the first run merges with
          # `--delete-branch`, so by the time run 2 looks, the head branch is
          # gone. Verified against this repository's own history — the query
          # still returns the merged PRs #5 and #6.
          #
          # Computed BEFORE the "nothing found" exit below: a duplicate run
          # finds nothing to delete, and must not be mistaken for a request
          # against a shelf that never existed.
          branch="community-removal/$SHELF-$ISSUE"
          if ! prior="$(gh pr list --state all --head "$branch" --json number --jq '.[].number')"; then
            echo "could not list PRs for $branch — refusing to act without knowing" >&2
            exit 1
          fi
          if [ -n "$prior" ]; then
            echo "duplicate: #$ISSUE already produced PR(s) $(echo "$prior" | tr '\n' ' ')" >&2
            echo "state=duplicate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Shelf ownership is decided case-insensitively (GitHub logins are unique
          # case-insensitively), so the directory on disk may differ in case from
          # what the issue says. Resolve the real name under each hard-coded root
          # — `cookbook/community` is the live lane, `community` is the pre-split
          # one during the migration window. -mindepth/-maxdepth 1 keep the search
          # to one level, so nothing outside those two roots can be a target.
          targets=()
          for root in cookbook/community community; do
            [ -d "$root" ] || continue
            found="$(find "$root" -mindepth 1 -maxdepth 1 -type d -iname "$SHELF" | head -n 1)"
            # an if, not `[ ... ] && ...`: under `set -e` a failing AND-list as
            # the last command of the loop body would end the step
            if [ -n "$found" ]; then targets+=("$found"); fi
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git rm -r --quiet -- "${targets[@]}"
          list="${targets[*]}"
          git commit -q -m "community: remove $list at its owner's request (closes #$ISSUE)"
          git push -q origin "$branch"

          gh pr create --base "$BASE" --head "$branch" \
            --title "community: remove $list (#$ISSUE)" \
            --body "Requested by the shelf's owner in #$ISSUE. Verified automatically: the issue author's login matches the directory. / 棚の本人からの削除依頼（#$ISSUE）。起票者とディレクトリ名の一致は自動照合済み。"
          gh pr merge "$branch" --squash --delete-branch

          echo "state=removed" >> "$GITHUB_OUTPUT"
          echo "targets=$list" >> "$GITHUB_OUTPUT"

      # `!= 'duplicate'` is not defensive tidiness. Without it the echo run
      # would find nothing, report "nothing was removed", and close the issue
      # as `not_planned` — overwriting the `completed` the real run had just
      # set, and telling the requester their shelf is still there.
      - if: steps.verify.outputs.ok == 'true' && steps.rm.outputs.state != 'duplicate'
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.rm.outputs.state }}
          SHELF: ${{ steps.verify.outputs.shelf }}
          TARGETS: ${{ steps.rm.outputs.targets }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const removed = process.env.STATE === 'removed';
            // what was actually deleted (one path, or both roots during the
            // migration window) — reported verbatim, not reconstructed
            const paths = (process.env.TARGETS || '').split(/\s+/).filter(Boolean);
            const removedList = paths.map((p) => `\`${p}/\``).join(', ');
            const missing = `\`cookbook/community/${process.env.SHELF}/\``;

            const en = removed
              ? `${removedList} has been removed from \`main\`.\n\n`
                + '**This is not un-publishing.** The content stays in the git history of this repository '
                + 'and of every clone, fork, and mirror that already pulled it. If a secret was in it, '
                + 'rotate the secret — that is the only action that actually takes effect.'
              : `There is no ${missing} on \`main\` (nor under the pre-split \`community/\` root) — `
                + 'nothing was removed. If the shelf is under a different name, reopen with the exact path.';
            const ja = removed
              ? `${removedList} を \`main\` から削除しました。\n\n`
                + '**これは「公開の取り消し」ではありません。** 内容はこのリポジトリと、'
                + '既に pull した全ての clone / fork / ミラーの git 履歴に残ります。'
                + '秘密情報が含まれていたなら、**実際に効く対処はローテーションだけ**です。'
              : `\`main\` に ${missing} は見当たらず（移行前の \`community/\` 直下にもありません）、**何も削除していません**。`
                + '別名の棚であれば、正確なパスを添えて再度お願いします。';

            await github.rest.issues.createComment({
              owner, repo, issue_number, body: `${en}\n\n---\n\n${ja}`,
            });
            // 'completed' only when something was actually removed — a request that
            // did nothing must not be closed as if it had been carried out
            await github.rest.issues.update({
              owner, repo, issue_number,
              state: 'closed', state_reason: removed ? 'completed' : 'not_planned',
            });
