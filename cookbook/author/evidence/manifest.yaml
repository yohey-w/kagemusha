# ═══════════════════════════════════════════════════════════════════════════
# manifest.yaml — この公開パッケージの台帳 / the ledger of what was published
#
# **この判断公開パッケージ**の公開物を1件1行で数える。**非公開のものも、区分と
# 広い理由分類だけは行として載せる**——載せないと母数が嘘になるからだ。
#
# ⚠️ 射程は「選別して公開すると決めた記録」だけだ。evidence/ の解説ファイル
#    （README.md・failure-cases/README.md）と、判断公開パッケージより前からある
#    2つの抜粋（ledger_excerpt.md・weekly_distill_log_excerpt.txt）は、
#    **この台帳の行にはならない**。前者は台帳の説明であって台帳の対象ではなく、
#    後者は別の主張（機構が無人で回った証拠）を担う抜粋で、母数も別だからだ。
#
# 区分の定義・判定の3検査・変換の型は disclosure-policy.md が正本。
#   P0 原文公開 / P1 派生公開 / P2 存在と集計のみ / P3 非公開（構造も示さない）
#
# 検算のしかた（4行とも実行して一致することを確かめられる）:
#   ls principles/public  | wc -l                              -> 21   (P0)
#   ls principles/derived | wc -l                              ->  7   (P1)
#   sed -n '/^principles_withheld:/,/^$/p' manifest.yaml | grep -c '^  - id:'  ->  3   (P3)
#   21 + 7 + 3 = 31 = 価値判断モデルの原則の全数
#
#   ⚠️ `grep -c "P3" manifest.yaml` では数えられない——この文字列は区分の定義行・
#      denominators・原則以外の P3 行にも出るので 3 にならない。数えるのは
#      `principles_withheld` の要素数であって、文字列の出現回数ではない。
#      （この注記自体が、最初に書いた検算手順が間違っていたことの記録である）
# ═══════════════════════════════════════════════════════════════════════════

manifest_version: 1
published_at: "2026-08-06"
source_instance: "作者の実走インスタンス（n=1）"
policy: disclosure-policy.md

# ─── 母数 / denominators ────────────────────────────────────────────────
denominators:
  judgment_principles:
    total: 31
    P0: 21
    P1: 7
    P2: 0
    P3: 3
  unnumbered_items:
    total: 2
    note: >-
      1件は state-guardrails/ として P1 で派生公開。もう1件（決定規則）は
      disclosure-policy.md §3 に吸収したため、独立ファイルとしては数えない。
  misassertion_cases:
    total: 9
    P0: 3
    P2: 6
    detail: failure-cases/aggregate-manifest.yaml
  unnumbered_withheld:
    total: 2
    note: >-
      安定 ID を持たない非公開の構成物 2 件（state_guardrails の state-profile-triggers と
      memory_architecture の persona-memory-values）。原則 31 本にも unnumbered_items の 2 件にも
      含まれない別の集合で、この台帳の行数を合わせるために数えている。
      うち persona-memory-values は「人物像メモリの実値は全件非公開」と同じものを指すので、
      足し上げるときに二重に数えないこと。→ disclosure-policy.md §4 の表の最下行

# ⚠️ 安定 ID は話題順に振られている。したがって欠番の位置から、非公開 3 本がモデルの
#    どのあたりの領域にあるかは**ある程度推測できる**——番号を残すことは完全な遮蔽ではない。
#    それでも振り直さないのは、母数の正直さを優先したからだ。振り直せば位置は隠れるが、
#    「31 のうち 3 本を伏せた」という検算可能性そのものが消える。検算可能性のほうを取った。

