# ─── この台帳が証明していないこと / scope ────────────────────────────────
not_proven:
  - 選別が正しいこと。判定は1名の判断であり、外部監査を受けていない
  - 非公開分が公開分と同じ性質であること（読者は確かめられない）
  - 匿名化に漏れが無いこと。機械ゲートが拾うのは既知のパターンだけ
  - これが他の環境で妥当な線であること（n=1）
